# Forgejo CI for terva-lampi, the gate for internal pull requests.
# External agents' pull requests land on GitHub and are gated by
# .github/workflows/ci.yml. docs/pr-reviews.md describes both.
#
# The gates match `just ci` / `make ci`: vet, gofmt, test, and a build
# of the binary. The test step adds -race, which the suite passes and
# the GitHub workflow does not run. The commands are inline because the
# container does not install just. When a gate changes in the justfile,
# change it here and in .github/workflows/ci.yml.
#
# Actions resolve against this Forgejo, not GitHub, so checkout comes
# from the Actions-Mirrors org, and Go comes from the internal
# registry's golang image rather than setup-go. Both follow the other
# terva-sh repositories. The registry mirror is curated: 1.27-alpine is
# proven there, and it is the same Go line as go.mod.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and Test
    runs-on: docker
    container:
      image: container.local.sothr.com/library/golang:1.27-alpine
    steps:
      - name: Install dependencies
        # git for the checkout. gcc and musl-dev are cgo, which -race
        # needs on alpine; without them the race step fails to link.
        # curl is what install.sh downloads with, for TestInstallScript*.
        run: apk add --no-cache git gcc musl-dev curl

      - name: Checkout Code
        uses: Actions-Mirrors/forgejo-actions-checkout@v6

      - name: Download modules
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      # internal/accept.TestMVPAcceptance is the MVP gate. internal/recall
      # takes about 270s under -race on an idle workstation, and a runner
      # shared by several pull requests pushed it past Go's default 10m
      # per package, so a loaded runner gets 25m and fails only on a hang
      # (TKT-01M622K0PH21D6WX3HDDRM7VHK).
      - name: go test (race)
        run: go test -race -timeout 25m ./...

      - name: go build
        run: go build -o bin/terva-lampi ./cmd/terva-lampi

  image:
    name: Build Image
    # Builds the lake image for both platforms with Buildah, the way the
    # Sothr-Containers repositories build on this runner, and pushes
    # nothing: GHCR is the one registry, and .github/workflows/release.yml publishes to it. Every RUN in the
    # Dockerfile runs on the build platform, so arm64 needs no QEMU.
    runs-on: docker
    container:
      image: container.local.sothr.com/library/buildah:latest
      options: --device=/dev/fuse --security-opt seccomp=unconfined
    steps:
      - name: Checkout Code
        uses: Actions-Mirrors/forgejo-actions-checkout@v6

      # Docker format keeps HEALTHCHECK, which the OCI format drops.
      - name: Build linux/amd64 and linux/arm64
        run: |
          buildah build --format docker \
            --platform linux/amd64,linux/arm64 \
            --manifest localhost/terva-lampi:ci .

      # The image has no shell, so buildah run calls the binary itself.
      - name: Run the amd64 binary
        run: |
          set -eu
          c=$(buildah from --platform linux/amd64 localhost/terva-lampi:ci)
          buildah run "$c" -- /usr/local/bin/terva-lampi --version
          buildah run "$c" -- /usr/local/bin/terva-lampi serve healthcheck --help >/dev/null
          buildah rm "$c"
