# Public release: pushing a v* tag to the mirror builds every target with
# goreleaser and publishes the archives as a GitHub release. install.sh
# downloads from here. This follows git-ticket's release workflow.
#
# The Forgejo twin is .forgejo/workflows/release.yml; both fire on the same
# tag once it is pushed to each forge.
name: release

on:
  push:
    tags:
      - "v*"

# goreleaser creates the release and uploads the archives to it.
permissions:
  contents: write

jobs:
  goreleaser:
    name: Build and Publish Release
    # Forgejo Actions runs .github/workflows too and reports the same owner
    # and name, so only the server URL tells the two apart. Without this the
    # Forgejo runner would fail resolving actions/checkout and race the
    # Forgejo workflow to publish the same tag.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # go build takes the version from the tag at HEAD, and the
          # changelog reads the log between tags. A shallow checkout would
          # ship binaries reporting 0.0.0.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        # A tag is cut from main, which CI has already passed, so this is
        # the last look before anything is published.
        run: |
          go vet ./...
          go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Two tags can sit on one commit, as v0.2.0-rc2 and v0.2.0 did.
          # goreleaser picks by version sort, where -rc2 sorts after the
          # release, and built v0.2.0 as 0.2.0-rc2. Name the tag.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Verify the published binary reports the tag
        # goreleaser has already published by now, so this is a post-check.
        # A failure leaves a release someone must delete by hand, which is
        # still better than not noticing a binary that reports 0.0.0.
        run: |
          set -eu
          tmp=$(mktemp -d)
          archive=$(ls dist/terva-lampi_*_linux_amd64.tar.gz)
          tar -xzf "${archive}" -C "${tmp}"
          got=$("${tmp}/terva-lampi" --version)
          echo "built: ${got}"
          # The whole word: v0.2.0-rc2 contains v0.2.0.
          case " ${got} " in
            *" ${GITHUB_REF_NAME} "*) echo "carries ${GITHUB_REF_NAME}" ;;
            *)
              echo "::error::the binary reports '${got}', which does not carry ${GITHUB_REF_NAME}"
              echo "The build lost its VCS stamps. Delete the release, then check"
              echo "that the checkout is not shallow before tagging again."
              exit 1
              ;;
          esac

  image:
    name: Build and Publish Image
    # The same guard as above: only github.com publishes to GHCR. The
    # Forgejo release builds the image and pushes nothing.
    if: github.server_url == 'https://github.com'
    # A tag whose tests or archives failed publishes no image either.
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/terva-sh/lampi
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # The build cross-compiles and needs no emulation. QEMU is here
      # for the check at the end, which runs the arm64 image.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v0.2.0 publishes 0.2.0, 0.2, 0 and latest. A pre-release such as
      # v0.3.0-rc1 publishes only 0.3.0-rc1: metadata-action skips the
      # short tags for a pre-release, and latest=auto skips latest.
      # Every publish also gets sha-<short>.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short

      # VERSION is the tag with its v, which is what an archive's
      # --version reports, so a lake in a container and an agent from
      # an archive name the same release. CREATED is the commit time,
      # so a rebuild of the tag labels the same date.
      - name: Build stamps
        id: stamp
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ steps.stamp.outputs.commit }}
            CREATED=${{ steps.stamp.outputs.created }}
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify each platform reports the tag
        # A post-check, like the archive check above: a failure leaves a
        # published image someone must look at, which beats not noticing.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        # DIGEST names the multi-platform index. docker run --platform
        # against an index digest fails in the classic image store with
        # "cannot overwrite digest", so run each platform's own manifest.
        run: |
          set -eu
          index=$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}")
          for platform in linux/amd64 linux/arm64; do
            manifest=$(printf '%s' "${index}" | jq -r --arg os "${platform%/*}" --arg arch "${platform#*/}" \
              '.manifests[] | select(.platform.os == $os and .platform.architecture == $arch) | .digest')
            if [ -z "${manifest}" ]; then
              echo "::error::the index ${DIGEST} has no ${platform} manifest"
              exit 1
            fi
            got=$(docker run --rm --platform "${platform}" "${IMAGE}@${manifest}" --version)
            echo "${platform}: ${got}"
            case " ${got} " in
              *" ${GITHUB_REF_NAME} "*) ;;
              *)
                echo "::error::${platform} reports '${got}', which does not carry ${GITHUB_REF_NAME}"
                exit 1
                ;;
            esac
          done
